<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  body { width: 240px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; padding: 12px; }
  h3 { font-size: 14px; margin: 0 0 8px; }
  p { font-size: 12px; color: #555; margin: 4px 0; line-height: 1.5; }
  .tip { color: #888; font-size: 11px; }
</style>
</head>
<body>
  <h3>抖音直播人数悬浮窗</h3>
  <p>打开任意 <code>live.douyin.com</code> 直播间,右上角即出现圆形悬浮按钮,显示当前观看人数。</p>
  <p>点击按钮可展开详情:房间标题、主播、累计观看、点赞、跳转本地控制台。</p>
  <p class="tip">每 30 秒自动刷新。按钮可拖动调整位置,设置保存在 localStorage。</p>
</body>
</html>
