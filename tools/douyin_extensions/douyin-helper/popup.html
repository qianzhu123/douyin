<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Douyin Helper</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f7fbff;
      }
      h1 { margin: 0 0 10px; font-size: 16px; }
      p { margin: 6px 0; font-size: 12px; line-height: 1.6; color: #47637f; }
      code { background: #e7f0fb; padding: 1px 4px; border-radius: 3px; }
    </style>
  </head>
  <body>
    <h1>Douyin Helper</h1>
    <p>打开抖音页面后，右上角会自动出现悬浮按钮。点击展开后会按当前页面类型自动展示：</p>
    <p>
      <strong>视频 / 笔记 / 短链 / 聚合页</strong>：下载当前作品。<br />
      <strong>个人主页</strong>：一键导入到本地账户列表。<br />
      <strong>直播间</strong>：把直播间元数据写入本地缓存后跳转控制台。
    </p>
    <p>按钮 <em>重启本地后端</em> 可一键触发幂等重启（无需手动关掉 chrome.exe 再起）。</p>
    <p>本地后端需运行在 <code>http://127.0.0.1:8000</code>。</p>
  </body>
</html>
